[package]
name = "lut-camera"
version = "0.1.0"
edition = "2021"

[dependencies]
lut-core = { path = "../lut-core" }
lut-persist = { path = "../lut-persist" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = "3"
name: installers

# 安装包构建入口：macOS arm64 DMG 与 Windows x64 NSIS EXE 各自在原生 runner 上构建。
# 默认不自动触发（避免误发布）；需要时手动 workflow_dispatch，产物以 artifact 形式回收，
# 不发布到任何公开渠道。签名/公证凭据缺失时产物保持未签名，脚本会在日志中如实标注。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    # runs-on: macos-14 时作业未分配到 runner，1 秒内即 cancelled（无任何步骤）；改用 latest
    runs-on: macos-latest
    env:
      # 有 Developer ID 时在仓库 Secrets 中配置，脚本会自动改用正式签名并尝试公证
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Regression tests
        run: |
          node --test "Rust重构/dxo-lut-tool/dxo-app/tests/ui-state.test.cjs"
          (cd "Rust重构/dxo-lut-tool" && cargo test --locked -p lut-core -p lut-persist -p lut-camera -p dxo-app)
      - name: Build DMG
        run: bash "Rust重构/dxo-lut-tool/dist/build-macos-release.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: |
            Rust重构/dxo-lut-tool/dist/release/*.dmg
            Rust重构/dxo-lut-tool/dist/release/SHA256SUMS.txt

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # 有代码签名证书时配置；未配置则产物保持未签名
      TAURI_WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Regression tests
        run: |
          node --test "Rust重构/dxo-lut-tool/dxo-app/tests/ui-state.test.cjs"
          (cd "Rust重构/dxo-lut-tool" && cargo test --locked -p lut-core -p lut-persist -p lut-camera -p dxo-app)
      - name: Create FAT32 / exFAT test volumes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\dxo-vhd | Out-Null
          foreach ($t in @(@{ name = 'card32'; fs = 'FAT32'; letter = 'V' }, @{ name = 'cardex'; fs = 'exFAT'; letter = 'W' })) {
            $vhd = 'C:\dxo-vhd\' + $t.name + '.vhd'
            $script = 'C:\dxo-vhd\' + $t.name + '.txt'
            @(
              ('create vdisk file="{0}" maximum=256 type=expandable' -f $vhd),
              ('select vdisk file="{0}"' -f $vhd),
              'attach vdisk',
              'convert mbr',
              'create partition primary',
              ('format quick fs={0} label="DXO{1}"' -f $t.fs, $t.name),
              ('assign letter={0}' -f $t.letter)
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script
          }
          Get-CimInstance Win32_LogicalDisk | Where-Object { $_.DeviceID -in 'V:', 'W:' } | Select-Object DeviceID, DriveType, FileSystem | Format-Table -AutoSize | Out-String -Width 120
      - name: Windows runtime volume evidence
        shell: bash
        run: |
          cd "Rust重构/dxo-lut-tool"
          echo '--- 下限：系统卷与盘符枚举（不依赖测试卷） ---'
          cargo test --locked -p lut-camera --test windows_volume_facts -- --nocapture
          echo '--- FAT32 虚拟卷（V:） ---'
          DXO_TEST_VOLUME=V DXO_TEST_FSTYPE=msdos cargo test --locked -p lut-camera --test windows_volume_facts -- --nocapture test_volume_reports
          echo '--- exFAT 虚拟卷（W:） ---'
          DXO_TEST_VOLUME=W DXO_TEST_FSTYPE=exfat cargo test --locked -p lut-camera --test windows_volume_facts -- --nocapture test_volume_reports
      - name: Detach test volumes
        if: always()
        shell: pwsh
        run: |
          foreach ($n in 'card32', 'cardex') {
            $vhd = 'C:\dxo-vhd\' + $n + '.vhd'
            if (Test-Path $vhd) {
              $script = 'C:\dxo-vhd\detach-' + $n + '.txt'
              @(('select vdisk file="{0}"' -f $vhd), 'detach vdisk') | Set-Content -Encoding ascii $script
              diskpart /s $script
            }
          }
      - name: Build NSIS setup
        run: bash "Rust重构/dxo-lut-tool/dist/build-windows-release.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: |
            Rust重构/dxo-lut-tool/dist/release/*Setup.exe
            Rust重构/dxo-lut-tool/dist/release/SHA256SUMS.txt
      # 放在 upload-artifact 之后：这一项失败也不会让安装包证据消失。
      # runner 就是一台真实 Windows 11 x64，静默安装/卸载属于「安装通过」的可复核证据；
      # 但它没有交互桌面、也没有读卡器，因此不构成「硬件通过」，WebView2 干净机器场景也不在此覆盖。
      - name: Silent install and uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'Rust重构/dxo-lut-tool/dist/release'
          $exe = (Get-ChildItem $rel -Filter '*Setup.exe' | Select-Object -First 1).FullName
          Write-Host ('安装包 ' + $exe + ' 大小 ' + (Get-Item $exe).Length)
          Write-Host ('安装包 SHA256 ' + (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())
          Write-Host ('Authenticode ' + (Get-AuthenticodeSignature $exe).Status)
          $marker = Join-Path $env:RUNNER_TEMP 'dxo-data-smoke'
          if (Test-Path $marker) { Remove-Item $marker -Recurse -Force }
          New-Item -ItemType Directory -Force $marker | Out-Null
          $inst = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host ('安装器退出码 ' + $inst.ExitCode)
          if ($inst.ExitCode -ne 0) { throw 'NSIS 静默安装返回非 0' }
          $dirs = Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'Uninstall DXO-ONE-XLAB.exe') -or (Get-ChildItem $_.FullName -Filter 'uninst*.exe' -ErrorAction SilentlyContinue) }
          if (-not $dirs) { throw '安装后在 %LOCALAPPDATA% 找不到带卸载器的安装目录' }
          $dir = ($dirs | Select-Object -First 1).FullName
          Write-Host ('安装目录 ' + $dir)
          Get-ChildItem $dir -Recurse -File | Group-Object Extension | ForEach-Object { Write-Host ('  ' + $_.Name + ' x' + $_.Count) }
          $main = Get-ChildItem $dir -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -notmatch 'uninst' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $main) { throw '安装目录里找不到主程序 exe' }
          Write-Host ('主程序 ' + $main.FullName + ' 大小 ' + $main.Length)
          $env:DXO_DATA_DIR = $marker
          $app = Start-Process -FilePath $main.FullName -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw ('启动后自行退出，退出码 ' + $app.ExitCode) }
          Write-Host ('进程存活 PID ' + $app.Id + ' 主窗口标题 [' + $app.MainWindowTitle + ']')
          Get-ChildItem $marker -Recurse -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Host ('  数据目录 ' + $_.FullName) }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3
          $un = Get-ChildItem $dir -Filter 'uninst*.exe' | Select-Object -First 1
          $uninst = Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host ('卸载器退出码 ' + $uninst.ExitCode)
          Start-Sleep -Seconds 3
          if (Test-Path $dir) { Write-Host '警告：卸载后安装目录仍存在（NSIS 常残留空目录），继续核对主程序' }
          if (Test-Path $main.FullName) { throw '卸载后主程序仍在' }
          if (-not (Test-Path $marker)) { throw '卸载把本机数据目录（滤镜库/卡备份所在）删掉了，与交付说明不符' }
          Write-Host '结论：静默安装、启动、卸载均通过；本机数据目录按要求保留'
